name: Validate QR inventory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-lock.txt

      - name: Validate complete account inventory
        run: python scripts/validate_inventory.py inventory/codes.json

      - name: Verify deterministic generated files
        run: python scripts/generate.py --check

      - name: Run tests and decode every generated PNG and SVG
        run: python -m unittest discover -v
